name: aruna
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # ── Core scientific ──────────────────────────────────────────────────────────
  - numpy>=1.26
  - scipy>=1.12
  - pandas>=2.2
  - astropy>=6.0
  - matplotlib>=3.8       # notebooks / debug plots

  # ── Solar physics ────────────────────────────────────────────────────────────
  - sunpy>=5.1
  - pip:
    # sunkit-spex: spectral fitting (f_vth isothermal model, CHIANTI)
    - sunkit-spex>=0.5.0
    # solexsloods: ISRO dead-time correction package (install manually if not on PyPI)
    # pip install git+https://github.com/isro/solexsloods.git  (placeholder)

    # ── Spectral fitting ────────────────────────────────────────────────────────
    # - sherpa>=4.16

    # ── Machine learning ────────────────────────────────────────────────────────
    - torch>=2.2.0
    - torchvision>=0.17
    - scikit-learn>=1.4
    - lightgbm>=4.3
    - mapie>=0.8.0             # conformal prediction (MAPIE)
    - optuna>=3.6              # Bayesian hyperparameter search (XL-6)

    # ── Time-series foundation model ────────────────────────────────────────────
    - uni2ts>=1.0.0            # Moirai (Salesforce) — zero-shot forecasting

    # ── Change-point + signal processing ───────────────────────────────────────
    - ruptures>=1.1.9          # PELT change-point detection
    - PyWavelets>=1.6          # Morlet CWT for QPP detection
    - statsmodels>=0.14        # LOWESS detrending

    # ── Similarity search ───────────────────────────────────────────────────────
    - faiss-cpu>=1.8.0         # FAISS vector search (use faiss-gpu if CUDA available)
    - dtaidistance>=2.3.12     # DTW similarity

    # ── Data validation ──────────────────────────────────────────────────────────
    - pandera>=0.19

    # ── Message bus ─────────────────────────────────────────────────────────────
    - kafka-python>=2.0.2

    # ── API + database ──────────────────────────────────────────────────────────
    - fastapi>=0.111
    - uvicorn[standard]>=0.29
    - sqlalchemy>=2.0
    - psycopg2-binary>=2.9
    - alembic>=1.13
    - pydantic>=2.7

    # ── LLM (Ollama client) ──────────────────────────────────────────────────────
    - ollama>=0.2.0

    # ── Observability ────────────────────────────────────────────────────────────
    - structlog>=24.1
    - prometheus-client>=0.20
    - river>=0.21.0            # ADWIN model drift detection
    - mlflow>=2.13

    # ── Testing ─────────────────────────────────────────────────────────────────
    - pytest>=8.2
    - pytest-asyncio>=0.23
    - pytest-benchmark>=4.0
    - pytest-mock>=3.14
    - httpx>=0.27              # async HTTP client for FastAPI testing

    # ── Notebooks ────────────────────────────────────────────────────────────────
    - jupyterlab>=4.1
    - ipywidgets>=8.1

    # ── Utilities ───────────────────────────────────────────────────────────────
    - python-dotenv>=1.0
    - pyyaml>=6.0
    - tqdm>=4.66
    - langchain-core>=0.2      # optional — LangGraph for XL-6 agent workflow
    - langgraph>=0.1
